<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>校园生活 · 下载</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;width:100%}
  body{min-height:100vh;padding:32px 16px;
    background:linear-gradient(165deg,#0b1220 0%,#16233b 55%,#0d1728 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    color:#e8eef8;line-height:1.5}
  .wrap{width:100%;max-width:400px;margin:0 auto}
  .logo{width:78px;height:78px;border-radius:22px;margin:0 auto 18px;
    background:linear-gradient(140deg,#2ee08a,#0a9e5c);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px rgba(18,160,110,.32)}
  .logo svg{width:40px;height:40px}
  h1{font-size:25px;font-weight:600;text-align:center;letter-spacing:.6px}
  .sub{text-align:center;color:#8ca0bd;font-size:13px;margin-top:7px}
  .card{margin-top:26px;background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:20px 18px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;
    cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease;
    font-family:inherit}
  .btn:active{transform:scale(.98);filter:brightness(.95)}
  .btn-main{background:linear-gradient(135deg,#25c37a,#12915a);color:#fff;
    box-shadow:0 10px 24px rgba(18,145,90,.34)}
  .btn-alt{background:rgba(255,255,255,.07);color:#cbd9ee;
    border:1px solid rgba(255,255,255,.12);font-size:13.5px;padding:12px;
    margin-top:11px;font-weight:500}
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;
    background:rgba(255,255,255,.2);font-size:11.5px;font-weight:500}
  .meta{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:#7f93b0;margin-top:15px;padding:0 2px}
  .notes{margin-top:14px;padding:13px 15px;background:rgba(255,255,255,.04);
    border-radius:12px;font-size:12.5px;line-height:1.8;color:#9db0c9;
    white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .tip{margin-top:16px;font-size:11.5px;line-height:1.85;color:#6d8099;padding:0 4px}
  .tip b{color:#93a9c6;font-weight:500}
  .center{text-align:center;color:#8ca0bd;font-size:14px;line-height:1.9;padding:6px 0}
  .center small{font-size:12px;color:#6d8099}
  .loading{text-align:center;color:#6d8099;font-size:13px;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="14.5" cy="4.4" r="2.1" fill="#fff"/>
      <path d="M12.9 8.1 8.4 11.3l1.9 3.6M13.4 8.2l3.2 2.4 3.1.6M12.1 11.2l-1.3 4.4-3.4 4M11.2 15.9l3.6 1.2 1.8 3.1"
        stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>校园生活</h1>
  <div class="sub">运动世界校园 · 桌面客户端</div>

  <div class="card">
    <div id="target"><div class="loading">正在获取版本信息…</div></div>
    <div class="meta"><span id="ver">—</span><span id="size"></span></div>
    <div class="notes" id="notes" style="display:none"></div>
  </div>

  <div class="tip" id="tip"></div>
</div>

<script id="fallback" type="application/json">
{"apk":null,"mac":null}
</script>
<script>
(function () {
  var MIRRORS = [
    'https://gh-proxy.com/https://raw.githubusercontent.com/kumori07/campus-run-license/main/license.json',
    'https://cdn.jsdelivr.net/gh/kumori07/campus-run-license@main/license.json',
    'https://raw.githubusercontent.com/kumori07/campus-run-license/main/license.json'
  ];
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isMac = /Macintosh|Mac OS X/i.test(ua) && !isIOS;

  var latest = null;
  try { latest = JSON.parse(document.getElementById('fallback').textContent); } catch (e) {}

  function fmtSize(b) {
    b = Number(b) || 0;
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b > 0) return Math.round(b / 1024) + ' KB';
    return '';
  }

  function setMeta(o) {
    var v = document.getElementById('ver');
    var s = document.getElementById('size');
    var n = document.getElementById('notes');
    if (!o) { v.textContent = '—'; return; }
    v.textContent = 'v' + (o.vn || '');
    s.textContent = fmtSize(o.size);
    if (o.notes) { n.textContent = o.notes; n.style.display = 'block'; }
    else { n.style.display = 'none'; }
  }

  function pick() {
    var a = (latest && latest.apk) || null;
    var m = (latest && latest.mac) || null;
    var box = document.getElementById('target');
    var tip = document.getElementById('tip');

    if (isIOS) {
      box.innerHTML = '<div class="center">iOS 暂不支持<br><small>请用 Android 手机，或电脑访问</small></div>';
      tip.innerHTML = '';
      setMeta(null);
      return;
    }

    var h = '';
    if (isAndroid) {
      h += a && a.url
        ? '<a class="btn btn-main" href="' + a.url + '">下载 Android 版 <span class="badge">v' + a.vn + '</span></a>'
        : '<div class="center">暂无 Android 安装包</div>';
      if (m && m.url) h += '<a class="btn btn-alt" href="' + m.url + '">macOS 版 v' + m.vn + '</a>';
      tip.innerHTML = '首次安装时系统会提示「<b>允许安装未知应用</b>」，点一次以后不再询问。<br>'
        + '如果装完提示风险，选「<b>仍然安装</b>」即可。';
      setMeta(a || m);
    } else if (isMac) {
      h += m && m.url
        ? '<a class="btn btn-main" href="' + m.url + '">下载 macOS 版 <span class="badge">v' + m.vn + '</span></a>'
        : '<div class="center">暂无 macOS 安装包</div>';
      if (a && a.url) h += '<a class="btn btn-alt" href="' + a.url + '">Android 版 v' + a.vn + '</a>';
      tip.innerHTML = '下载后打开 DMG，把「校园生活」拖进「应用程序」即可。<br>'
        + '若提示「无法验证开发者」，右键图标 → <b>打开</b>。';
      setMeta(m || a);
    } else {
      if (a && a.url) h += '<a class="btn btn-main" href="' + a.url + '">下载 Android 版 <span class="badge">v' + a.vn + '</span></a>';
      if (m && m.url) h += '<a class="btn btn-alt" href="' + m.url + '">下载 macOS 版 v' + m.vn + '</a>';
      if (!h) h = '<div class="center">正在获取下载地址…</div>';
      tip.innerHTML = '手机上打开本页会自动显示对应版本。';
      setMeta(a || m);
    }
    box.innerHTML = h;
  }

  function load() {
    var done = false;
    var i = 0;
    function next() {
      if (done || i >= MIRRORS.length) { pick(); return; }
      var u = MIRRORS[i++];
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); next(); }, 2600);
      fetch(u, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (o) {
          clearTimeout(timer);
          if (o && o.latest && (o.latest.apk || o.latest.mac)) {
            latest = o.latest;
            done = true;
          }
          next();
        })
        .catch(function () { clearTimeout(timer); next(); });
    }
    pick();          // 先用内嵌兜底渲染，别让用户干等
    next();
  }

  load();
})();
</script>
</body>
</html>
